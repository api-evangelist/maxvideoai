name: MaxVideoAI
aid: maxvideoai
description: >-
  MaxVideoAI is a multi-model AI video and image production service delivered
  entirely through a remote MCP server, so assistants like Claude, ChatGPT and
  Codex can plan shots, compare current video/image models, estimate project
  budgets, prepare an exact quote, approve a single paid generation, recover
  results, and keep media in one private account library. It is pay-as-you-go on
  prepaid credits with no subscription, uses OAuth 2.1 (PKCE + dynamic client
  registration) for connection, and deliberately ships no REST API or customer
  API keys — the MCP tool surface is the product.
